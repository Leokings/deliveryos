[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deliveryos-agent"
version = "0.1.0"
description = "Agent-callable GenLayer delivery lifecycle, without custody"
requires-python = ">=3.11"
dependencies = [
  "genlayer-py==0.16.3",
  "mcp>=2,<3",
]

[tool.setuptools.packages.find]
include = ["deliveryos_agent*"]
